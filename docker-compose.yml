services:
  postgres:
    image: postgres:16-alpine
    container_name: helpvenezuela-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: helpvenezuela
      POSTGRES_PASSWORD: helpvenezuela
      POSTGRES_DB: helpvenezuela
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
